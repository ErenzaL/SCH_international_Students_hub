# Render Blueprint. Review, then: Dashboard > New > Blueprint > select this repo.
# Deploys: .github/workflows/render-deploy.yml calls each service's Deploy Hook on push to main
# (repository secrets RENDER_DEPLOY_HOOK_API / RENDER_DEPLOY_HOOK_WEB).
# Nothing is deployed until you do that and fill the `sync: false` secrets in the dashboard.
services:
  - type: web
    name: sch-hub-api
    runtime: python
    rootDir: backend
    plan: free            # free instances sleep when idle and have ~512 MB RAM (see docs/setup.md, "Memory")
    pythonVersion: "3.11.9"
    # e5_onnx needs no PyTorch; prefetching bakes the ~124 MB model into the build so cold starts do not download it
    buildCommand: pip install -r requirements.txt && python -m app.cli prefetch-model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_JWT_SECRET, sync: false }
      - { key: CORS_ORIGINS, sync: false }      # e.g. https://sch-international-students-hub.onrender.com (CORS_ALLOWED_ORIGINS also accepted)
      - { key: EMBEDDING_PROVIDER, value: e5_onnx }   # int8 ONNX E5 (~440 MB steady incl. API); "e5" = PyTorch (>1 GB)
      - { key: EMBEDDING_CACHE_DIR, value: .model-cache }
      # glibc: 2 memory arenas instead of 8 per CPU. Measured at 0.1 CPU: peak 457 instead of 485 MB (PSS), 491 instead of 540 MB (RSS),
      # 312 instead of 422 MB after a 9 MB PDF (docs/development/RENDER-MEMORY.md). Read at process start; not an app setting.
      - { key: MALLOC_ARENA_MAX, value: "2" }
      - { key: EMBEDDING_MODEL, value: intfloat/multilingual-e5-small }
      - { key: RETRIEVAL_MIN_SIMILARITY, value: "0.80" }
      - { key: LLM_PROVIDER, value: none }          # gemini to enable answers (set LLM_API_KEY first; see docs/assistant.md)
      - { key: LLM_API_KEY, sync: false }           # server-side only; never NEXT_PUBLIC_*
      - { key: GEMINI_PRIMARY_MODEL, value: gemini-3.6-flash }       # gemini-3.5-flash is deprecated -> routed here
      - { key: GEMINI_FALLBACK_MODEL, value: gemini-3.5-flash-lite }
      - { key: GEMINI_THINKING_LEVEL, value: low }
      - { key: ASSISTANT_PROMPT_VERSION, value: system_v2 }  # backend/app/services/assistant/prompts/system_v2.txt (v1 kept)
      - { key: LLM_REQUEST_TIMEOUT_SECONDS, value: "30" }
      - { key: LLM_MAX_ATTEMPTS_PER_MODEL, value: "2" }
      - { key: AI_DAILY_LIMIT_PER_CLIENT, value: "40" }   # anonymous visitors, per client IP
      - { key: AI_DAILY_LIMIT_PER_USER, value: "150" }    # signed-in students
      - { key: AI_DAILY_LIMIT_GLOBAL, value: "1500" }     # all generated answers per KST day
      - { key: CLIENT_IP_HEADER, value: "" }              # set (e.g. true-client-ip) ONLY after the client-ip check passes
      - { key: TRUSTED_PROXY_HOPS, value: "1" }
      # Phase 2 ---------------------------------------------------------------------------------
      - { key: JOB_EXECUTION, value: worker }        # persistent queue claimed by an in-process worker
      - { key: CRON_SECRET, sync: false }            # enables POST /api/v1/internal/sync/run-due (GitHub Actions)
      - { key: OCR_PROVIDER, value: none }           # none | ocr_space (hosted, free key) | tesseract (needs binary)
      - { key: OCR_SPACE_API_KEY, sync: false }      # only for OCR_PROVIDER=ocr_space

  - type: web
    name: sch-hub-web
    runtime: node
    rootDir: apps/web
    plan: free
    buildCommand: npm ci && npm run build      # no model downloads happen at build time
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - { key: NEXT_PUBLIC_SUPABASE_URL, sync: false }
      - { key: NEXT_PUBLIC_SUPABASE_ANON_KEY, sync: false }
      # Baked into the bundle at BUILD time: after changing it, redeploy (rebuild), not just restart.
      - { key: NEXT_PUBLIC_API_URL, sync: false }  # e.g. https://sch-hub-api.onrender.com (no trailing /api/v1)

  # Optional scheduled sync (paid Cron Job). Free web services sleep, so the API never schedules work itself.
  # - type: cron
  #   name: sch-hub-sync
  #   runtime: python
  #   rootDir: backend
  #   schedule: "0 20 * * *"      # 05:00 KST daily
  #   buildCommand: pip install -r requirements.txt -r requirements-ml.txt
  #   startCommand: python -m app.cli run-due
